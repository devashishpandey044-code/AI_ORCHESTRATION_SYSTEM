name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://lifeos:lifeos@localhost:5432/lifeos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m app.evals.grounding
      - run: python -m app.evals.safety
      - run: python -m app.evals.retrieval
      - run: python -m app.evals.roadblocks
      - run: python -m app.evals.pipeline
      - run: python -m app.evals.planning
      - run: python -m app.evals.personas
      - run: python -m app.evals.checkins
      - run: python -m app.evals.report --check
